<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Biblioteca Aurora</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-acceso">
  <aside class="acceso-portada">
    <p class="marca">Biblioteca Aurora</p>
    <h1>Cada libro del catálogo, en un solo lugar.</h1>
    <p>Consulta los títulos disponibles y, si eres parte del equipo de la biblioteca, mantén el acervo al día.</p>
  </aside>

  <main class="acceso-panel">
    <div class="acceso-tarjeta">
      <div class="pestanas" role="tablist" aria-label="Acceso">
        <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="form-login">Iniciar sesión</button>
        <button type="button" role="tab" id="tab-registro" aria-selected="false" aria-controls="form-registro">Crear cuenta</button>
      </div>

      <form id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" name="email" autocomplete="username" required>

        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>

        <button type="submit" class="boton boton-primario">Entrar</button>
      </form>

      <form id="form-registro" role="tabpanel" aria-labelledby="tab-registro" novalidate hidden>
        <label for="registro-nombre">Nombre</label>
        <input type="text" id="registro-nombre" name="nombre" autocomplete="name" required minlength="2">

        <label for="registro-email">Correo electrónico</label>
        <input type="email" id="registro-email" name="email" autocomplete="username" required>

        <label for="registro-password">Contraseña</label>
        <input type="password" id="registro-password" name="password" autocomplete="new-password" required minlength="8" aria-describedby="ayuda-password">
        <small id="ayuda-password">Mínimo 8 caracteres.</small>

        <button type="submit" class="boton boton-primario">Crear cuenta</button>
      </form>

      <p id="mensaje" class="mensaje-error" role="alert"></p>
      <a class="enlace-volver" href="index.html">Ver el catálogo sin iniciar sesión</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
